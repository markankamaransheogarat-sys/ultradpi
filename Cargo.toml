[package]
name = "ultradpi"
version = "1.0.0"
edition = "2021"
authors = ["markankamaransheogarat-sys <279850453+markankamaransheogarat-sys@users.noreply.github.com>"]
description = "Next-gen zero-config TSPU / DPI evasion engine. Outperforms GoodbyeDPI: UDP voice desync for Discord/Battlefield, TLS mid-SNI splitting, fake packet injection, and ISP auto-tuning."
license = "MIT"
repository = "https://github.com/markankamaransheogarat-sys/ultradpi"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
rand = "0.8"
colored = "2.1"
warp = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
