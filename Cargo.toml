[package]
name = "ultradpi"
version = "1.0.0"
edition = "2021"
authors = ["markankamaransheogarat-sys <279850453+markankamaransheogarat-sys@users.noreply.github.com>"]
description = "Next-gen zero-config TSPU / DPI evasion engine. Native Windows WinDivert / NFQWS kernel level bypass."
license = "MIT"
repository = "https://github.com/markankamaransheogarat-sys/ultradpi"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Security", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Environment"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
